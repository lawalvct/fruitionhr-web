<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FruitionHR Logo</title>
  <desc id="desc">FruitionHR logo with three progressive green square frames and modern wordmark.</desc>
  <defs>
    <linearGradient id="greenGradient" x1="70" y1="70" x2="360" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="0.48" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="460" y1="160" x2="900" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#064E3B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="36" fill="#FFFFFF"/>

  <!-- Icon: progressive square frames -->
  <g filter="url(#softShadow)" transform="translate(70 60)">
    <rect x="0" y="0" width="82" height="82" rx="8" fill="#ECFDF5" stroke="#86EFAC" stroke-width="18" transform="rotate(-5 41 41)"/>
    <rect x="68" y="56" width="128" height="128" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="28" transform="rotate(-3 132 120)"/>
    <rect x="168" y="138" width="178" height="178" rx="16" fill="#F0FDF4" stroke="url(#greenGradient)" stroke-width="36" transform="rotate(1 257 227)"/>

    <!-- small connecting growth line -->
    <path d="M72 70 C105 95 125 110 155 134 C190 160 214 182 252 220" stroke="#16A34A" stroke-width="8" stroke-linecap="round" opacity="0.38"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(455 126)">
    <text x="0" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="url(#wordGradient)">Fruition</text>
    <text x="420" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-3" fill="#22C55E">HR</text>
    <rect x="2" y="118" width="522" height="4" rx="2" fill="#BBF7D0"/>
    <text x="4" y="170" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="500" letter-spacing="0.4" fill="#64748B">Empowering Your Workforce</text>
  </g>
</svg>
